plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "athanor-alchemy"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"athanor" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "athanor-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// Temporary: prints selected Minecraft signatures to the CI log.
tasks.register('probeApi') {
	def cpc = project.sourceSets.main.compileClasspath
	doLast {
		def cp = cpc.files
		def jars = cp.findAll { it.name.contains('minecraft') }
		println "PROBE jars ${jars*.name}"
		def javap = "${System.getProperty('java.home')}/bin/javap"
		def path = jars*.path.join(File.pathSeparator)
		def classes = ['net.minecraft.world.level.Level', 'net.minecraft.server.level.ServerLevel',
			'net.minecraft.world.item.Item$Properties', 'net.minecraft.world.item.ToolMaterial',
			'net.minecraft.world.effect.MobEffect', 'net.minecraft.world.item.component.WrittenBookContent',
			'net.minecraft.server.network.Filterable', 'net.minecraft.world.entity.player.Player',
			'net.minecraft.world.item.ItemCooldowns', 'net.minecraft.world.item.Item',
			'net.minecraft.world.item.component.Consumables', 'net.minecraft.world.entity.Entity',
			'net.minecraft.world.level.LevelReader', 'net.minecraft.world.level.LevelAccessor',
			'net.minecraft.world.item.component.CustomData', 'net.minecraft.nbt.CompoundTag',
			'net.minecraft.world.level.levelgen.placement.PlacedFeature', 'net.minecraft.core.registries.Registries',
			'net.minecraft.world.entity.LivingEntity', 'net.minecraft.world.level.block.Block',
			'net.minecraft.world.level.block.state.BlockBehaviour', 'net.minecraft.world.item.ItemStack',
			'net.minecraft.world.level.block.DropExperienceBlock', 'net.minecraft.util.valueproviders.UniformInt',
			'net.minecraft.world.effect.MobEffectCategory', 'net.minecraft.server.level.ServerPlayer']
		def proc = ([javap, '-public', '-cp', path] + classes).execute()
		def out = new StringBuilder()
		proc.consumeProcessOutput(out, out)
		proc.waitFor()
		out.toString().eachLine { println "PROBE $it" }
		def names = new java.util.zip.ZipFile(jars.find { it.name.contains('merged') || it.name.contains('common') } ?: jars[0]).entries().collect { it.name }
		names.findAll { it ==~ /(?i).*(moon|clock|timeline|environmentattrib).*\.class/ && !it.contains('$') }.each { println "PROBE class $it" }
	}
}
